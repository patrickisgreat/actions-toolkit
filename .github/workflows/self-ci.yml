# CI for this repo. Not reusable — the `self-` prefix marks it as ours.
#
# A toolkit that ships broken pipelines is worse than no toolkit, because the failure lands
# in someone else's repo where they can't fix it. So this does more than lint:
#
#   lint      — actionlint (with shellcheck on every `run:`), yamllint, commitlint
#   validate  — the repo's own conventions (scripts/validate-manifests.mjs)
#   docs      — generated docs must match the manifests
#   execute   — the actions that can run without cloud credentials are actually RUN and
#               their outputs asserted. Static analysis cannot tell you that a jq filter
#               produces the shape the next step reads.
#   consume   — the reusable workflows are called end-to-end from this repo, exercising the
#               `.toolkit` checkout mechanism the whole design rests on.

name: Self CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Rapid pushes shouldn't each run a full pipeline. `main` is exempt: every merge there is a
# release candidate that consumers will pin to.
concurrency:
  group: self-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # See the Makefile: nearly every `run:` here embeds a single-quoted jq program whose
  # `$name` references are jq variables, so SC2016 is a false positive in essentially
  # every instance and its noise would bury real findings.
  SHELLCHECK_OPTS: --exclude=SC2016

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run yamllint
        run: |
          set -euo pipefail
          python -m pip install --quiet yamllint
          yamllint -c .yamllint.yml .github actions

  validate:
    name: Validate manifests & docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install tooling
        run: |
          set -euo pipefail
          npm ci || npm install

      - name: Validate manifest conventions
        run: |
          set -euo pipefail
          node scripts/validate-manifests.mjs

      - name: Check generated docs
        run: |
          set -euo pipefail
          node scripts/gen-docs.mjs --check

      - name: Check that every action ref resolves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No linter talks to GitHub, so a pin to a tag that does not exist is invisible
          # until the step runs — potentially in a consumer's deploy pipeline.
          ./scripts/check-action-refs.sh

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The action lists the PR's commits through the API; without this it fails with
      # "Resource not accessible by integration" before it lints anything.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint PR commits against Conventional Commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  # ── Execute the credential-free actions and assert their outputs ─────────────────────
  test-actions:
    name: Execute actions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # pr-comment is exercised for real against this PR — create, find, delete. There is
      # no way to test it without the permission it exists to use.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `./actions/...` works here because this IS the toolkit repo — the `.toolkit`
      # indirection is only needed inside reusable workflows called from elsewhere.
      - name: resolve-env — maps, literals, and a missing secret
        id: resolve
        uses: ./actions/resolve-env
        with:
          mappings: |
            MAPPED_VALUE=FAKE_SECRET
            ABSENT_VALUE=DOES_NOT_EXIST
          literal-vars: |
            LITERAL_VALUE=hello
          mask-literals: 'false'
          secrets-json: '{"FAKE_SECRET":"resolved-ok"}'

      - name: Assert resolve-env
        env:
          RESOLVED: ${{ steps.resolve.outputs.resolved }}
        run: |
          set -euo pipefail
          [ "$MAPPED_VALUE" = "resolved-ok" ] || { echo "::error::mapping did not resolve (got '${MAPPED_VALUE:-}')"; exit 1; }
          [ "$LITERAL_VALUE" = "hello" ] || { echo "::error::literal did not resolve"; exit 1; }
          # A mapping with no matching secret must warn and be skipped, not fail the step
          # and not export an empty variable.
          [ -z "${ABSENT_VALUE:-}" ] || { echo "::error::absent mapping should not have been exported"; exit 1; }
          [ "$RESOLVED" = "MAPPED_VALUE,LITERAL_VALUE" ] || { echo "::error::unexpected resolved list '$RESOLVED'"; exit 1; }
          echo "resolve-env OK"

      - name: setup-node — detect pnpm and install
        id: setup-node
        uses: ./actions/setup-node
        with:
          node-version: '22'
          working-directory: tests/fixtures/node-pnpm
          install: 'false'

      - name: Assert setup-node
        env:
          MANAGER: ${{ steps.setup-node.outputs.package-manager }}
        run: |
          set -euo pipefail
          [ "$MANAGER" = "pnpm" ] || { echo "::error::expected pnpm, detected '$MANAGER'"; exit 1; }
          node --version
          echo "setup-node OK"

      - name: changed-files — directory matrix
        id: changed
        uses: ./actions/changed-files
        with:
          matrix-glob: 'tests/fixtures/**'
          matrix-marker: 'marker.txt'

      - name: Assert changed-files
        env:
          DIRECTORIES: ${{ steps.changed.outputs.directories }}
        run: |
          set -euo pipefail
          echo "directories=$DIRECTORIES"
          jq -e 'type == "array"' <<< "$DIRECTORIES" > /dev/null ||
            { echo "::error::directories is not a JSON array"; exit 1; }
          echo "changed-files OK"

      - name: notify — job summary only
        uses: ./actions/notify
        with:
          status: success
          title: Self-CI notification test
          text: Rendered by the `notify` action with no webhooks configured.
          fields: '{"Suite":"self-ci","Runner":"ubuntu-latest"}'

      - name: pr-comment — create
        id: comment
        uses: ./actions/pr-comment
        with:
          marker: self-ci-smoke
          body: |
            Transient self-CI check of the `pr-comment` action. Deleted moments later by
            the same job — if you are reading this, the cleanup step did not run.

      - name: Assert pr-comment
        env:
          COMMENT_ID: ${{ steps.comment.outputs.comment-id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # On a PR the action must find the number from the payload and return an id.
            [ -n "$COMMENT_ID" ] || { echo "::error::pr-comment returned no comment id on a pull_request event."; exit 1; }
            echo "pr-comment created comment $COMMENT_ID"
          else
            # On a push there is no PR to comment on; the action must skip, not fail.
            [ -z "$COMMENT_ID" ] || { echo "::error::pr-comment should be a no-op off a pull request, but returned '$COMMENT_ID'."; exit 1; }
            echo "pr-comment correctly skipped outside a pull request"
          fi

      - name: pr-comment — delete
        # `always()` so a failed assertion above still cleans the comment up.
        if: ${{ always() }}
        uses: ./actions/pr-comment
        with:
          marker: self-ci-smoke
          mode: delete

      - name: setup-terraform — resolve the version and run fmt
        id: setup-tf
        uses: ./actions/setup-terraform
        with:
          version: '1.9.8'
          tflint: 'true'

      - name: Assert setup-terraform
        env:
          TF_VERSION: ${{ steps.setup-tf.outputs.version }}
        run: |
          set -euo pipefail
          [ "$TF_VERSION" = "1.9.8" ] || { echo "::error::expected 1.9.8, got '$TF_VERSION'"; exit 1; }
          terraform version
          tflint --version
          echo "setup-terraform OK"

      - name: git-ssh-auth — make a throwaway key
        id: throwaway-key
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -C self-ci -f "$RUNNER_TEMP/throwaway"
          {
            echo 'key<<EOF_KEY'
            cat "$RUNNER_TEMP/throwaway"
            echo 'EOF_KEY'
          } >> "$GITHUB_OUTPUT"

      - name: git-ssh-auth — configure
        id: ssh-auth
        uses: ./actions/git-ssh-auth
        with:
          ssh-private-key: ${{ steps.throwaway-key.outputs.key }}

      - name: Assert git-ssh-auth
        env:
          KEY_PATH: ${{ steps.ssh-auth.outputs.key-path }}
        run: |
          set -euo pipefail
          [ "$(stat -c %a "$KEY_PATH")" = "600" ] || { echo "::error::key file must be 0600"; exit 1; }
          case "$GIT_SSH_COMMAND" in
            *"StrictHostKeyChecking=yes"*) ;;
            *) echo "::error::GIT_SSH_COMMAND must pin host keys, got '$GIT_SSH_COMMAND'"; exit 1 ;;
          esac
          hosts="$(dirname "$KEY_PATH")/known_hosts"
          grep -q '^github.com ssh-ed25519 ' "$hosts" || { echo "::error::github.com ed25519 host key not pinned"; exit 1; }
          echo "git-ssh-auth OK"

      - name: git-ssh-auth — an empty key must fail
        id: ssh-auth-empty
        continue-on-error: true
        uses: ./actions/git-ssh-auth
        with:
          ssh-private-key: ''

      - name: Assert git-ssh-auth refuses an empty key
        env:
          OUTCOME: ${{ steps.ssh-auth-empty.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "::error::an empty key must fail, got '$OUTCOME'"; exit 1; }
          echo "git-ssh-auth correctly refused an empty key"

      - name: setup-python — uv install in a fixture project
        id: setup-py
        uses: ./actions/setup-python
        with:
          python-version: '3.12'
          working-directory: tests/fixtures/python-uv
          groups: ''

      - name: Assert setup-python
        run: |
          set -euo pipefail
          python --version
          echo "setup-python OK"

  # ── Call the reusable workflows for real ─────────────────────────────────────────────
  # These call the reusable workflows for real, which exercises the `.toolkit` checkout.
  #
  # ⚠️ They are NOT equivalent to a consumer calling them. Here the caller and the toolkit
  # are the same repo, so any ref that resolves to a commit in *this* repo works — which is
  # exactly how `github.job_workflow_sha || github.sha` passed here for months while failing
  # in every consumer. The real guard is the `toolkit-checkout` rule in
  # scripts/validate-manifests.mjs; treat these jobs as smoke, not proof.
  consume-node-ci:
    name: Consume node-ci
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/node-pnpm
      lint-command: ''
      format-command: ''
      typecheck-command: ''
      test-command: 'run test'
      build-command: 'run build'
      coverage: false
      e2e: none

  consume-terraform-ci:
    name: Consume terraform-ci
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/terraform-ci.yml
    with:
      directories: 'tests/fixtures/terraform'
      version: '1.9.8'
      tflint: false
      trivy: false
      docs-check: false

  all-green:
    name: All checks
    # A single required status check for branch protection: as jobs are added above, the
    # protection rule doesn't have to be edited to match.
    needs: [lint, validate, test-actions, consume-node-ci, consume-terraform-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' <<< "$RESULTS")"
          if [ -n "$failed" ]; then
            echo "::error::Failed job(s): $(tr '\n' ' ' <<< "$failed")"
            exit 1
          fi
          echo "All checks passed."
