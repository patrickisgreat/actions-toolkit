# actionlint configuration.
#
# See docs/AUTHORING.md for why each exception exists. Every entry here is a known gap in
# actionlint's model, not a rule we're opting out of — anything actionlint is right about
# gets fixed in the workflow instead.

paths:
  .github/workflows/**/*.yml:
    ignore:
      # `job.workflow_sha` is the commit SHA of the reusable workflow file currently
      # executing — GitHub added the `job` context on 2026-04-23. actionlint 1.7.12 knows
      # `job.workflow_ref` and `job.workflow_repository` but not `job.workflow_sha`, so
      # every `.toolkit` checkout — the mechanism the whole repo is built on, see CLAUDE.md
      # — trips this. Drop the ignore once actionlint catches up. Track:
      # https://docs.github.com/actions/reference/workflows-and-actions/contexts#job-context
      - 'property "workflow_sha" is not defined'

      # Reusable workflows here take credentials as optional `secrets:` and pass them
      # straight through to an action. actionlint can't know a caller will supply them.
      - 'secret "[A-Z_]+" is not defined'
