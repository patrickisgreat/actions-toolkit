# GitHub Actions YAML is long-lined and heavily commented by nature; this config
# keeps yamllint useful (real syntax and structural problems) without fighting
# the format. actionlint covers Actions-specific semantics.
extends: default

rules:
  line-length:
    max: 120
    level: warning
    allow-non-breakable-words: true
  comments:
    min-spaces-from-content: 1
  document-start: disable
  # `on:` is the Actions trigger key, not the YAML 1.1 boolean.
  truthy:
    check-keys: false
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1

ignore: |
  node_modules/
  .toolkit/
